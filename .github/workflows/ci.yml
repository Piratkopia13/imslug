# imslug CI - keeps the repo green on both supported toolchains.
#
# Entry points are the scripts/ in the repository (never ad-hoc cmake commands):
# build -> test -> check_docs on Windows (MSVC) and Linux (GCC/Clang).
# Coverage beyond the default build/test:
#   * the shader-staleness check (every job): glslang comes from the distro
#     package on Linux and from a pinned glslang release download on Windows
#     (the runner image has no Vulkan SDK), and golden-image tests on Linux
#     with lavapipe (a software Vulkan device, so no GPU is required);
#   * the C API ABI gate (C11 TU, strict warnings) and the C example (CPU smoke
#     in every job; the headless Vulkan frame in the lavapipe job - the Windows
#     runner image has no Vulkan SDK, so the Vulkan part of the C example is
#     only compile-tested on Linux);
#   * the offline generator + packed `.imslug` suites in every job
#     (imslug_packed_loader, imslug_packed_roundtrip, imslug_asset_fresh,
#     imslug_golden_packed*) and a dedicated no-parser job
#     (IMSLUG_TTF_PARSER=OFF) proving the packed path without stb_truetype;
#   * the clean-project FetchContent job (a throwaway CMake project consumes
#     this repository as a dependency, builds the example + a minimal consumer
#     and runs them).
#
# Push and pull request runs execute the full matrix (except the benchmark
# report, which is main-push / dispatch only). The scheduled run exists solely
# for the Dear ImGui master drift check and executes only that job: a cron
# tick does not change anything in this repository, so re-running the push-CI
# matrix on a schedule would test a state that push CI already covered - and
# only spend runner minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily upstream drift check - see imgui-master-smoke below. Only that job
  # runs on `schedule`; every other job guards against the event.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same ref supersedes an older one instead of queueing.
# `event_name` in the group keeps the scheduled drift check from cancelling
# (or being cancelled by) a push CI run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: scripts/build.bat
      - name: Test
        run: scripts/test.bat
      - name: glslangValidator (shader freshness check; the runner image has no Vulkan SDK)
        shell: pwsh
        run: |
          # Pinned release; glslang 16.x names the tool `glslang` (found via PATH)
          # and its SPIR-V output is byte-identical to the committed header.
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip -OutFile "$env:RUNNER_TEMP\glslang.zip"
          Expand-Archive "$env:RUNNER_TEMP\glslang.zip" -DestinationPath "$env:RUNNER_TEMP\glslang"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\glslang\bin"
      - name: Shaders are fresh
        run: scripts/gen_shaders.bat --check
      - name: Check docs policy
        run: scripts/check_docs.bat

  linux:
    name: Linux (GCC/Clang)
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: glslangValidator (shader freshness check)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Fetch the test fonts (CJK subset + color emoji; suites skip when absent)
        run: |
          python3 -m pip install --quiet fonttools
          ./scripts/fetch_cjk_font.sh
          ./scripts/fetch_emoji_font.sh
      - name: Build
        run: ./scripts/build.sh
      - name: Test (includes the continuous fuzz + stress profiles)
        run: ./scripts/test.sh
      - name: Shaders are fresh
        run: ./scripts/gen_shaders.sh --check
      - name: Check docs policy
        run: ./scripts/check_docs.sh

  linux-golden:
    name: Linux golden images (lavapipe)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Vulkan (loader, tools, lavapipe software device)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools glslang-tools \
            mesa-vulkan-drivers libgl1-mesa-dri
      - name: Fetch the test fonts (CJK subset + color emoji; goldens skip when absent)
        run: |
          python3 -m pip install --quiet fonttools
          ./scripts/fetch_cjk_font.sh
          ./scripts/fetch_emoji_font.sh
      - name: Check vkEnumeratePhysicalDevices sees lavapipe
        run: vulkaninfo --summary || true
      - name: Build
        run: ./scripts/build.sh
      - name: Golden images (monochrome scenes + Slug-vs-atlas + emoji, both render paths)
        run: ./scripts/golden.sh
      - name: C example - headless Vulkan frame through the C API
        run: ./build/imslug_example_c --vulkan --screenshot build/golden/c_example.ppm

  # The no-parser configuration (IMSLUG_TTF_PARSER=OFF) proves the packed
  # `.imslug` path without any stb_truetype in the build: the packed loader
  # suite, the packed goldens (lavapipe, headless) and the example binary
  # (built without the parser, default font = the committed baked asset) run
  # from generated data only. Rendering from the asset is compared GPU-vs-CPU
  # by imslug_golden_packed; the example's window needs a display, so CI runs
  # its --help path.
  no-parser:
    name: No-parser build (packed .imslug assets only)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Vulkan (loader + lavapipe for the packed goldens)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers libgl1-mesa-dri \
            libglfw3-dev xorg-dev \
            libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Build (no TTF parser; example on)
        env:
          IMSLUG_BUILD_DIR: build-noparser
          IMSLUG_CMAKE_DEFINES: "-DIMSLUG_TTF_PARSER=OFF -DIMSLUG_BUILD_EXAMPLES=ON -DIMSLUG_BUILD_TOOLS=OFF"
        run: ./scripts/build.sh
      - name: Test (packed loader + packed goldens; parser-dependent suites excluded)
        env:
          IMSLUG_BUILD_DIR: build-noparser
          IMSLUG_CMAKE_DEFINES: "-DIMSLUG_TTF_PARSER=OFF -DIMSLUG_BUILD_EXAMPLES=ON -DIMSLUG_BUILD_TOOLS=OFF"
        run: ./scripts/test.sh
      - name: Example runs without a parser
        run: ./build-noparser/imslug_example_glfw_vulkan --help

  # Clean-project verification - a throwaway CMake project consumes this
  # repository via FetchContent (a git clone of the checked-out commit), builds
  # the GLFW+Vulkan example + a minimal consumer executable and runs both.
  # Vulkan headers are required at configure time (the example target); GLFW is
  # fetched and built by imslug. The example's --help path needs no GPU.
  fetchcontent-smoke:
    name: Clean-project FetchContent build (Linux)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Vulkan + GLFW build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers libgl1-mesa-dri \
            xorg-dev libgl1-mesa-dev ninja-build \
            libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Clean-project FetchContent build + run
        run: ./scripts/verify_fetchcontent.sh

  # The benchmark harness report is a build artifact (numbers are
  # informational; no budgets are enforced in CI - runner hardware is too
  # variable and the report records the machine it ran on). Main pushes and
  # manual dispatches only: a per-PR report would add a full extra build to
  # every push for numbers that gate nothing.
  linux-bench:
    name: Linux benchmark report (informational)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Vulkan (the bench target builds with the backend module)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev mesa-vulkan-drivers
      - name: Fetch the CJK test font (the CJK bench row is skipped when absent)
        run: |
          python3 -m pip install --quiet fonttools
          ./scripts/fetch_cjk_font.sh
      - name: Build + run the CPU benchmark
        run: ./scripts/bench.sh --cpu
      - name: Upload the benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: build/bench/bench_report.md

  # Optional, informational: does the internal-API layer still work against
  # Dear ImGui master? Daily (the only job a scheduled run executes; every
  # other job skips `schedule`) and on demand; a failure here means upstream
  # moved something imslug relies on - pin or adapt, but do not block the
  # release train on it (the pinned v1.92.9b jobs are the gate).
  imgui-master-smoke:
    name: Dear ImGui master smoke (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Vulkan (loader + lavapipe for the golden tests)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers libgl1-mesa-dri
      - name: "ImGui master: build + full test suite"
        run: ./scripts/smoke_imgui_master.sh